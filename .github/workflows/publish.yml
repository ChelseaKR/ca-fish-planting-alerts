name: publish

# CDFW's schedule is week-of granularity, so a daily poll is already far more
# frequent than the source changes -- see pipeline/data crawl budget in
# docs/LICENSES-AND-ATTRIBUTION.md ("one fetch per scheduled run, once a
# day"). 13:17 UTC = 06:17 Pacific Daylight / 05:17 Pacific Standard: a
# mid-morning Pacific hour, chosen so the freshness check's +/-1 day
# tolerance (pipeline/src/cfpa/fetch.py::assert_fresh) is never marginal
# against a UTC midnight rollover in either direction, well after CDFW
# hatchery staff would plausibly have updated the page overnight, and a
# non-zero minute avoids GitHub Actions' busiest top-of-hour scheduling slot.
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "pipeline/uv.lock"

      - name: install dependencies
        working-directory: pipeline
        run: uv sync --locked

      - name: run the pipeline (live fetch -> history -> snapshot -> site)
        # A failed run (stale page, fetch failure, parse drift, history
        # integrity violation, schema violation) exits non-zero here and the
        # job stops: no commit, no artifact upload, no deploy. Nothing is
        # ever published from a run that didn't fully succeed.
        working-directory: pipeline
        run: uv run cfpa --site-out ../site

      - name: commit updated history and alias table, if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/data/history.json pipeline/data/aliases.json
          if git diff --cached --quiet; then
            echo "no change to history or aliases this run"
          else
            git commit -m "data: pipeline run $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:main
          fi

      - name: upload site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
