# Local fast feedback (CODE-QUALITY-STANDARD §2 CQ-12; SECURITY-AND-SUPPLY-CHAIN
# §4 Gate 1, SEC-17). Install once with `pre-commit install --hook-type
# pre-commit --hook-type pre-push`. These hooks catch problems before a commit
# exists; `make verify` (and CI's `verify` job) remains the gate.
#
# The ruff hooks are pinned to the same version pipeline/uv.lock resolves, so
# a hook and `make lint` cannot disagree about a file. Bump both together.
# They are limited to Python files: newer ruff also formats code blocks inside
# Markdown, and docs/standards/ is a vendored copy that must stay
# byte-identical to its upstream tag.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      # pipeline/ files find pipeline/pyproject.toml on their own, which keeps
      # its per-file ignores (tests/**) relative to the right directory.
      - id: ruff-check
        args: [--fix]
        files: ^pipeline/
        types_or: [python]
      - id: ruff-format
        files: ^pipeline/
        types_or: [python]
      # scripts/ has no config of its own; `make lint` points it at the
      # pipeline's, so the hook does the same.
      - id: ruff-check
        name: ruff (scripts)
        args: [--fix, --config, pipeline/pyproject.toml]
        files: ^scripts/
        types_or: [python]
      - id: ruff-format
        name: ruff format (scripts)
        args: [--config, pipeline/pyproject.toml]
        files: ^scripts/
        types_or: [python]

  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict (make typecheck)
        entry: make typecheck
        language: system
        pass_filenames: false
        stages: [pre-push]
