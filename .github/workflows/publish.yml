name: publish

# CDFW's schedule is week-of granularity, so a daily poll is already far more
# frequent than the source changes -- see pipeline/data crawl budget in
# docs/LICENSES-AND-ATTRIBUTION.md ("one fetch per scheduled run, once a
# day"). 13:17 UTC = 06:17 Pacific Daylight / 05:17 Pacific Standard: a
# mid-morning Pacific hour, chosen so the freshness check's +/-1 day
# tolerance (pipeline/src/cfpa/fetch.py::assert_fresh) is never marginal
# against a UTC midnight rollover in either direction, well after CDFW
# hatchery staff would plausibly have updated the page overnight, and a
# non-zero minute avoids GitHub Actions' busiest top-of-hour scheduling slot.
# (The check compares CDFW's stated current WEEK with the run date's week,
# +/- 1 day at the Sunday boundary; the page states a week, not a day.)
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          # The data push below authenticates explicitly, so no token is left
          # in .git/config for the rest of the job.
          persist-credentials: false

      - name: install uv
        # No dependency cache in this job (CI-CD-STANDARD §8c, CICD-24). It
        # commits to main and builds the artifact that gets deployed, so a
        # poisoned cache entry would go straight to production.
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: install pinned gitleaks
        # Checked against a hash committed here, not a checksum file from the
        # same release. Used by the commit step below.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" gitleaks

      - name: install dependencies
        working-directory: pipeline
        run: uv sync --locked

      - name: run the pipeline (live fetch -> history -> snapshot -> site)
        # A failed run (stale page, fetch failure, parse drift, history
        # integrity violation, schema violation) exits non-zero here and the
        # job stops: no commit, no artifact upload, no deploy. Nothing is
        # ever published from a run that didn't fully succeed.
        working-directory: pipeline
        # Owner-set repository variables (Settings -> Secrets and variables ->
        # Actions -> Variables); all optional. Unset SITE_BASE_URL keeps the
        # github.io default. Unset APP_STORE_URL keeps the site saying the app
        # is not in the App Store yet. Passed through env, not interpolated
        # into the script.
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          APP_STORE_URL: ${{ vars.APP_STORE_URL }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: |
          uv run cfpa --site-out ../site \
            --base-url "$SITE_BASE_URL" \
            --app-store-url "$APP_STORE_URL" \
            --support-email "$SUPPORT_EMAIL"

      - name: commit updated history and alias table, if any
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/data/history.json pipeline/data/aliases.json
          if git diff --cached --quiet; then
            echo "no change to history or aliases this run"
          else
            # IR-16: secret-scan exactly what is staged, before the commit
            # exists. This job commits to main unattended every day.
            "$RUNNER_TEMP/bin/gitleaks" git --pre-commit --staged \
              --redact --no-banner --exit-code 1 .
            git commit -m "data: pipeline run $(date -u +%Y-%m-%dT%H:%MZ)"
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            echo "::add-mask::${auth}"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
              push origin HEAD:main
          fi

      - name: upload site as a Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  alert-on-failure:
    # The scheduled run failed on 2026-09-15, 09-16 and 09-17, and nothing
    # reported it until someone went looking. A failed or timed-out run now
    # opens one tracking issue, or comments on it if it is already open, so
    # a stale site produces a notification. A timeout is included because
    # GitHub reports a job that hits timeout-minutes as cancelled, not failed.
    needs: [build, deploy]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: open or update the publish-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail
          title="publish: the daily pipeline run failed"
          existing="$(gh issue list --state open --search "\"${title}\" in:title" \
            --json number,title --jq "[.[] | select(.title == \"${title}\")][0].number // empty")"
          body="The publish workflow did not finish (trigger: ${TRIGGER}). Nothing from this run was committed or deployed, and the live site still shows the last successful run. Run: ${RUN_URL}"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}" --label bug
          fi
