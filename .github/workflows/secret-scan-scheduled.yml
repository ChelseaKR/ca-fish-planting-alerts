name: secret-scan-scheduled

# SECURITY-AND-SUPPLY-CHAIN §4 Gate 3 (SEC-19): a weekly TruffleHog scan of
# the full history, every commit reachable from every ref, with a second
# engine besides the gitleaks run in `make verify`.
#
# --results=verified,unknown,unverified. A credential that was committed and
# later revoked comes back `unverified`, because the provider now says no,
# and revocation is the usual end state of a real leak. `--only-verified`
# and `--results=verified,unknown` both drop that tier, and a scan with
# either setting cannot fail on the case a history scan exists for. If a
# fixture ever fires, exclude that detector by name. Do not drop a tier.
# Measured before landing: this repository's history (2,994 chunks, 4.0 MB)
# reports zero findings under all three tiers at TruffleHog 3.97.5.
#
# The pinned binary is run directly rather than the TruffleHog action. The
# action's `version:` input selects the scanner separately from its `uses:`
# SHA, and Dependabot or Renovate updates the SHA without seeing it, so the
# two drift apart.

on:
  schedule:
    - cron: "37 11 * * 3" # Wednesdays, 11:37 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: secret-scan-scheduled
  cancel-in-progress: true

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # Without full history this is a one-commit scan that still
          # reports success.
          fetch-depth: 0
          persist-credentials: false

      - name: full-history secret scan (TruffleHog, all result tiers)
        env:
          TRUFFLEHOG_VERSION: 3.97.5
          TRUFFLEHOG_SHA256: e3d97199c565c37ca6152750197f667e08ae6a1edf5911fbdec168622b28620c
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/trufflehog.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          echo "${TRUFFLEHOG_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" trufflehog
          # fetch-depth: 0 gives every branch as a remote-tracking ref, and a
          # file:// scan walks those too (checked: a key planted and deleted on
          # a branch that exists only as origin/<branch> exits 183).
          "$RUNNER_TEMP/trufflehog" git "file://${GITHUB_WORKSPACE}" \
            --results=verified,unknown,unverified \
            --fail \
            --no-update

  alert-on-failure:
    # A weekly scan nobody hears about is the failure this job exists to
    # prevent. Same shape as publish.yml's alert.
    needs: trufflehog
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: open or update the secret-scan issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="security: the scheduled full-history secret scan failed"
          existing="$(gh issue list --state open --search "\"${title}\" in:title" \
            --json number,title --jq "[.[] | select(.title == \"${title}\")][0].number // empty")"
          body="TruffleHog reported a finding in the repository history, or the scan could not complete. Read the run log, then follow INCIDENT-RESPONSE-STANDARD §4 (rotate, revoke, assess, decide on history) if a credential is real. Run: ${RUN_URL}"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}" --label bug
          fi
