[project]
name = "cfpa"
version = "0.1.0"
description = "CDFW fish-planting schedule pipeline: fetch, normalise, append-only history, snapshot, static site."
readme = "README.md"
authors = [
    { name = "Chelsea Kelly-Reif (she/her)", email = "3114598+ChelseaKR@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.23",
    "jinja2>=3.1",
]

[project.scripts]
cfpa = "cfpa.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "freezegun>=1.5",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv_build]
package = true
