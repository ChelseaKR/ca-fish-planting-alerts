name: codeql

# Deep SAST for the pipeline's Python and for the workflows themselves
# (SECURITY-AND-SUPPLY-CHAIN §3 SEC-08, CI-CD-STANDARD §7 CICD-20). Runs on
# pull requests into main and weekly (CI-CD §11e); the weekly run is what
# catches a new query landing against code that has not changed.
#
# Code scanning was not available while this repository was private: `GET
# /code-scanning/alerts` returned 403 "Code scanning is not enabled" (checked
# 2026-09-17). The repository has been public since 2026-09-18, but the
# analysis still runs with `upload: never`, keeps the SARIF as an artifact,
# and scripts/codeql_gate.py fails the job on any result whose rule is
# problem.severity `error` or security-severity 7.0 or higher, and on an
# analysis that produced no SARIF at all. Switching back to uploading is a
# separate change.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 9 * * 2" # Tuesdays, 09:41 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql-${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # CodeQL needs this to read run metadata on a private repository
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: initialise CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: analyse (no upload)
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:${{ matrix.language }}
          upload: never
          upload-database: false
          output: sarif-results

      - name: keep the SARIF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          if-no-files-found: warn
          retention-days: 30

      - name: gate on the SARIF
        run: |
          set -euo pipefail
          python3 scripts/codeql_gate.py --self-test
          python3 scripts/codeql_gate.py sarif-results
