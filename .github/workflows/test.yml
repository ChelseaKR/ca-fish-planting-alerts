name: test

on:
  pull_request:
    paths:
      - "pipeline/**"
      - "schema/**"
      - ".github/workflows/test.yml"
      - ".github/workflows/publish.yml"
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "schema/**"
      - ".github/workflows/test.yml"
      - ".github/workflows/publish.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "pipeline/uv.lock"

      - name: install dependencies
        working-directory: pipeline
        run: uv sync --locked

      - name: run tests
        working-directory: pipeline
        run: uv run pytest -v

      - name: dry-run build against the fresh fixture (schema + site, no network)
        working-directory: pipeline
        run: |
          uv run cfpa \
            --fixture tests/fixtures/schedule-fresh-2026-09-13.html \
            --fixture-fetched-at 2026-09-13T12:00:00Z \
            --run-today 2026-09-13 \
            --history /tmp/dryrun-history.json \
            --aliases /tmp/dryrun-aliases.json \
            --site-out /tmp/dryrun-site
